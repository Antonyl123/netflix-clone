<!DOCTYPE html>
<html>
<head>
    <title>Netflix Clone</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:black;
            color:white;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
            background:rgba(0,0,0,0.7);
        }

        .logo{
            color:red;
            font-size:40px;
            font-weight:bold;
        }

        .signin{
            background:red;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            font-size:16px;
        }

        .hero{
            height:90vh;
            background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop') center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        .content h1{
            font-size:60px;
        }

        .content p{
            font-size:24px;
        }

        .start-btn{
            background:red;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:20px;
            border-radius:5px;
        }

    </style>
</head>

<body>

    <div class="header">
        <div class="logo">NETFLIX</div>

        <button class="signin">Sign In</button>
    </div>

    <div class="hero">

        <div class="content">

            <h1>Unlimited movies, TV shows and more</h1>

            <p>Watch anywhere. Cancel anytime.</p>

            <button class="start-btn">Get Started</button>

        </div>

    </div>

</body>
</html>
